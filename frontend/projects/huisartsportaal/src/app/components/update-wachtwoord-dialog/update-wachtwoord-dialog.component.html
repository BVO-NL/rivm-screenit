<ds-modal [config]="modalConfig" header="Wachtwoord wijzigen" (modalClosed)="annuleren()">
  <form [formGroup]="updateWachtwoordForm">
    <app-wachtwoord-form-input data-testid="huidig_wachtwoord_input"
                               label="Huidig wachtwoord"
                               formControlName="oudeWachtwoord"
                               [validators]="[Validators.required]"
                               [required]="true"
                               [errorMessage]="{required: 'Het oude wachtwoord is verplicht'}"
    />
    <app-wachtwoord-form-input data-testid="nieuw_wachtwoord_input"
                               label="Nieuw wachtwoord"
                               formControlName="nieuweWachtwoord"
                               [errorMessage]="{minlength: 'Wachtwoord moet minstens 12 tekens bevatten', required: 'Het nieuwe wachtwoord is verplicht'}"
                               [required]="true"
                               [validators]="wachtwoordControlValidators"/>
    <app-wachtwoord-form-input data-testid="nieuw_controle_wachtwoord_input"
                               label="Nieuw wachtwoord controle"
                               formControlName="nieuweWachtwoordControle"
                               [required]="true"
                               [errorMessage]="{ required: 'Het controle wachtwoord is verplicht', waardenOngelijk: 'Het nieuwe wachtwoord moet overeenkomen met het nieuwe controle wachtwoord.'}"
                               [validators]="nieuweWachtwoordControlValidators"/>
  </form>
  <div *ds-footer-actions-right class="footer">
    <button ds-button-secondary (click)="annuleren()" data-testid="annuleren_button">Annuleren</button>
    <button ds-button-primary (click)="opslaan()" data-testid="opslaan_button">Opslaan</button>
  </div>
</ds-modal>
