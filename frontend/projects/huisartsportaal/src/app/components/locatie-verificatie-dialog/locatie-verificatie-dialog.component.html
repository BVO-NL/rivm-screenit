<app-base-dialog titel="Locatie verifiëren">
  <div body>
    <p>Voer hier de verificatiecode in die u voor de betreffende locatie heeft ontvangen op uw zorgmailadres. Na het verifiëren kunt u laboratoriumformulieren aanvragen en
      huisartsberichten ontvangen.</p>
    <form [formGroup]="verificatieForm">
      <ds-input label="Locatienaam" formControlName="locatieNaam"/>
      <ds-input label="Zorgmail klantnummer" formControlName="zorgmailKlantnummer"/>
      <ds-input label="Verificatiecode" formControlName="verificatieCode"/>
    </form>
  </div>
  <div buttons class="gap-2 display-flex">
    <button ds-button-secondary (click)="herzendMail()" data-testid="herzend_mail_button">Herzend verificatiemail</button>
    <button ds-button-secondary (click)="sluiten()" data-testid="sluiten_button">Sluiten</button>
    <button ds-button-primary (click)="verifieerLocatie()" [disabled]="verificatieForm.invalid" data-testid="verifieer_locatie_button">Verifiëren</button>
  </div>
</app-base-dialog>
