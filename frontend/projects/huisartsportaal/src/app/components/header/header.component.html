<header>
  <ds-navigation-topbar [navigationItems]="navigationItems()" [config]="topbarNavigationConfig">
    <ng-template dsNavigationTopbarCustomButtons>
      @for (action of actions(); track action) {
        @if (action.callback) {
          <button ds-button-quaternary (click)="action.callback()" [attr.data-testId]="action.testId">
            {{ action.label }}
            <ds-icon [icon]="action.icon"/>
          </button>
        } @else {
          <button ds-button-quaternary [routerLink]=action.routerLink [attr.data-testId]="action.testId">
            {{ action.label }}
            <ds-icon [icon]="action.icon"/>
          </button>
        }
      }
    </ng-template>
  </ds-navigation-topbar>
</header>
