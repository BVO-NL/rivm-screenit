<ds-card cardTitle="Wachtwoord opnieuw aanvragen" class="container">
  <form [formGroup]="wachtwoordAanvragenForm">
    <ds-input
      formControlName="emailOfGebruikersnaam"
      label="E-mail of gebruikersnaam"
      placeholder="E-mail of gebruikersnaam"
      type="text"
    />
    <ds-input
      formControlName="inlogCode"
      label="Inlogcode"
      placeholder="Inlogcode"
      type="text"
    />
    <ng-template ds-footer-actions-right>
      <button (click)="wachtwoordAanvragen()" ds-button-primary>Wachtwoord invoeren</button>
    </ng-template>
  </form>
</ds-card>
