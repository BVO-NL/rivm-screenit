<ds-card cardTitle="Wachtwoord vergeten" class="container">
  <form [formGroup]="wachtwoordVergetenForm">
    <ds-input
      formControlName="gebruikersnaam"
      label="Gebruikersnaam"
      placeholder="Gebruikersnaam"
      type="text"
      data-testid="gebruikersnaam-input"
    />
    <ds-input
      formControlName="email"
      label="E-mail"
      placeholder="E-mail"
      type="text"
      data-testid="email-input"
      [errorMessage]="{email: 'Het e-mailadres is niet valide'}"
    />
    <ng-template ds-footer-actions-right>
      <button (click)="wachtwoordOpvragen()" ds-button-primary data-testid="wachtwoord_opvragen_button">
        Wachtwoord opvragen
      </button>
    </ng-template>
  </form>
</ds-card>
