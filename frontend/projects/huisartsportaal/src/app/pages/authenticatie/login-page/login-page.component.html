<ds-card cardTitle="Inloggen huisartsenportaal" class="container">
  <p>U logt in op een systeem met vertrouwelijke informatie. Door verder te gaan verklaart u akkoord te gaan met de verantwoording die bij deze informatie hoort. Deze gegevens
    dienen te allen tijde vertrouwelijk behandeld te worden.</p>
  <form [formGroup]="loginForm" class="mt-2" id="inlog-formulier" (ngSubmit)="inloggen()">
    <ds-input
      formControlName="gebruikersnaam"
      label="Gebruikersnaam"
      placeholder="Gebruikersnaam"
    />
    <ds-input
      formControlName="wachtwoord"
      label="Wachtwoord"
      placeholder="Wachtwoord"
      type="password"
    />
    <button type="button" ds-button-small ds-button-tertiary routerLink="/wachtwoordvergeten">Wachtwoord opnieuw instellen</button>
    <ng-template ds-footer-actions-right>
      <button type="submit" form="inlog-formulier" ds-button-primary>Inloggen</button>
    </ng-template>
  </form>

</ds-card>
