<ds-card cardTitle="Wachtwoord opnieuw aanvragen" class="container">
  <form [formGroup]="wachtwoordWijzigenForm">
    <ds-input
      formControlName="nieuweWachtwoord"
      label="Nieuwe wachtwoord"
      placeholder="Nieuwe wachtwoord"
      type="password"
      data-testid="nieuw_wachtwoord_input"
    />
    <ds-input
      formControlName="nieuweWachtwoordControle"
      label="Nieuwe wachtwoord (controle)"
      placeholder="Nieuwe wachtwoord (controle)"
      type="password"
      data-testid="nieuw_wachtwoord_controle_input"
    />
    <ng-template ds-footer-actions-right>
      <button (click)="wachtwoordWijzigen()" ds-button-primary data-testid="wachtwoord_invoeren_button">Wachtwoord invoeren</button>
    </ng-template>
  </form>
</ds-card>
