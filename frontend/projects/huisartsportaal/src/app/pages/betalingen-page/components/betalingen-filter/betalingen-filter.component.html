<div class="py-2 px-4 mb-5 verrichtingen-filter">
  <form [formGroup]="filterForm" (ngSubmit)="filteren()">
    <div class="row">
      <div class="col-md-6">
        <app-locatie-selector formControlName="locatie" label="Locatie"/>
        <ds-input label="Naam cliënt" formControlName="clientNaam" data-testid="naam_client_input"/>
        <ds-input label="Betalingskenmerk" formControlName="betalingskenmerk" data-testid="betalingskenmerk_input"/>
      </div>
      <div class="col-md-6">
        <ds-datepicker formControlName="betalingsdatumVanaf" label="Betalingsdatum vanaf" data-testid="betalingsdatum_vanaf_datepicker"/>
        <ds-datepicker formControlName="betalingsdatumTotEnMet" label="Betalingsdatum t/m" data-testid="betalingsdatum_tot_en_met_datepicker"/>
        <ds-checkbox formControlName="alleenZonderBetalingskenmerk" data-testid="regels_zonder_betalingskenmerk_checkbox">Alleen regels zonder betalingskenmerk</ds-checkbox>
      </div>
      <div class="row toolbar">
        <button ds-button-primary type="submit" data-testid="filteren_button">Filteren</button>
      </div>
    </div>
  </form>
</div>
