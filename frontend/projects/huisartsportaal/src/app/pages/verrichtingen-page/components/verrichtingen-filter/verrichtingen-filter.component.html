<div class="py-2 px-4 mb-5 verrichtingen-filter">
  <form [formGroup]="filterForm" (ngSubmit)="filteren()">
    <div class="row">
      <div class="col-md-6">
        <app-locatie-selector formControlName="locatie" label="Locatie"/>
        <ds-input label="Naam cliënt" formControlName="clientNaam"/>
      </div>
      <div class="col-md-6">
        <ds-datepicker formControlName="datumUitstrijkje" label="Datum uitstrijkje"/>
        <ds-datepicker formControlName="verrichtingsdatumVanaf" label="Verrichtingsdatum vanaf"/>
        <ds-datepicker formControlName="verrichtingsdatumTotEnMet" label="Verrichtingsdatum t/m"/>
      </div>
      <div class="row toolbar">
        <button ds-button-primary type="submit">Filteren</button>
      </div>
    </div>
  </form>
</div>
