<app-base-dialog size="lg" [titel]="gebeurtenis.gebeurtenis | enumLabel:typeGebeurtenisLabels" [sluitResultaat]="briefOpnieuwAangemaakt">
  <div body>
    <div class="row">
      <div class="col-4 info-label">Documentnaam</div>
      <div class="col-8">{{ gebeurtenis.documentNaam }}</div>
    </div>
    <div class="row">
      <div class="col-4 info-label">Datum/tijd</div>
      <div class="col-8">{{ gebeurtenis.datum | datumTijd }}</div>
    </div>
  </div>
  <ng-container buttons>
    @if (magVerstuurdeBriefInzien()) {
      <button (click)="verstuurdeBriefInzien()" data-testid="verstuurde_brief_inzien_btn" ds-button-secondary>Verstuurde brief inzien</button>
    }
    @if (magTemplateInzien()) {
      <button (click)="templateInzien()" data-testid="template_inzien_btn" ds-button-secondary>Template inzien</button>
    }
    @if (magActiveren()) {
      <button (click)="activeren()" data-testid="activeren_btn" ds-button-secondary>Herstel brief aanmaken</button>
    }
    @if (magTegenhouden()) {
      <button (click)="tegenhouden()" data-testid="tegenhouden_btn" ds-button-secondary>Tegenhouden</button>
    }
    @if (magOpnieuwAanmaken()) {
      <button (click)="opnieuwAanmaken()" data-testid="opnieuw_aanmaken_btn" ds-button-secondary>Opnieuw aanmaken</button>
    }
    <button (click)="annuleren()" data-testid="annuleren_btn" ds-button-primary>Sluiten</button>
  </ng-container>
</app-base-dialog>
