@if (paspoort(); as paspoort) {
  <div class="client-paspoort" data-testid="client-paspoort">
    <div class="client-paspoort-naam">
      <span class="naam" data-testid="naam">{{ naam() }}</span>
      <span class="geslacht" data-testid="geslacht" *appAutorisatie="genderIdentiteitConstraint">({{ paspoort.geslacht | geslachtAfkorting: 'x' }})</span>
    </div>

    @if (paspoort.overlijdensdatum) {
      <ds-description label="Overlijdensdatum" data-testid="overlijdensdatum">
        <ng-template ds-description-custom-template>
          <ds-badge type="error" [label]="(paspoort.overlijdensdatum | date: NL_DATE_FORMAT) ?? ''"/>
        </ng-template>
      </ds-description>
    } @else if (paspoort.doelgroepen.length) {
      <ds-description label="Doelgroep" data-testid="doelgroep">
        <ng-template ds-description-custom-template>
          <app-doelgroep-badges [doelgroepen]="paspoort.doelgroepen"/>
        </ng-template>
      </ds-description>
    }

    <ds-description label="Burgerservicenummer" data-testid="bsn" value="{{ bsnMetANummer() }}"/>
    <ds-description label="Geboortedatum" data-testid="geboortedatum" [value]="geboortedatumMetLeeftijd()"/>
    <ds-description [label]="telefoonLabel()" data-testid="telefoonnummer" [value]="telefoonnummer()"/>
    <ds-description label="E-mailadres" data-testid="emailadres" value="{{ paspoort.emailAdres | legeWaarde }}"/>
    <ds-description label="BRP-adres" data-testid="brp-adres" [value]="brpAdres()"/>
    @if (!adresGelijkAanBrp()) {
      <ds-description [label]="postadresLabel()" data-testid="adres" [value]="adres()"/>
    }
  </div>
}
