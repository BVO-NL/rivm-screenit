<app-base-dialog [titel]="strings.algemeen.handleidingen.bewerken.dialogTitle" size="md">
  <form [formGroup]="handleidingForm" body novalidate>
    <app-single-file-selector
      [label]="strings.algemeen.handleidingen.bewerken.fileSelectorLabel"
      formControlName="bestand"
      acceptedExtensie="pdf"
      data-testid="handleiding_uploaden"
    />
    <ds-input
      label="Bestandsnaam"
      formControlName="bestandsnaam"
      [errorMessage]="{minlength: strings.algemeen.errors.minKarakters('De bestandsnaam', 3), maxlength: strings.algemeen.errors.maxKarakters('De bestandsnaam', MAX_KARAKTERS.bestandsnaam)}"
      data-testid="bestandsnaam_input"
      required
      minlength="3"
      [dsMaxLength]="MAX_KARAKTERS.bestandsnaam"
    />
  </form>
  <ng-container buttons>
    <button (click)="annuleren()" data-testid="annuleren_btn"
            ds-button-tertiary>{{ strings.algemeen.buttons.annuleren }}
    </button>
    <button (click)="opslaan()" [disabled]="!isFormGeldig" ds-button-primary data-testid="opslaan_btn">
      {{ strings.algemeen.buttons.opslaan }}
    </button>
  </ng-container>
</app-base-dialog>
