<ds-page-header [title]="strings.algemeen.handleidingen.pageTitle" [showBackButton]="false">
  <button ds-button-primary (click)="openHandleidingDialog()" *appAutorisatie="toevoegenConstraint">
    <ds-icon [icon]="faAddIcon"/>
    {{ strings.algemeen.handleidingen.addButton }}
  </button>
</ds-page-header>

<table ds-table matSort matSortActive="bestandsnaam" class="mt-4 w-100"
       matSortDirection="asc" [dataSource]="dataSource()">
  <ng-container dsColumnDef="bestandsnaam">
    <th ds-header-cell *dsHeaderCellDef [mat-sort-header]="'bestandsnaam'">{{ strings.algemeen.labels.bestand }}</th>
    <td ds-cell *dsCellDef="let row">{{ row.bestandsnaam }}</td>
  </ng-container>
  <ng-container dsColumnDef="bewerkingsdatum">
    <th ds-header-cell *dsHeaderCellDef
        [mat-sort-header]="'bewerkingsdatum'">{{ strings.algemeen.labels.laatstBijgewerktOp }}
    </th>
    <td ds-cell *dsCellDef="let row">{{ row.bewerkingsdatum | date: NL_DATE_TIME_FORMAT }}</td>
  </ng-container>
  <ng-container dsColumnDef="laatstGewijzigdDoor">
    <th ds-header-cell *dsHeaderCellDef
        [mat-sort-header]="'laatstGewijzigdDoor'">{{ strings.algemeen.labels.gewijzigdDoor }}
    </th>
    <td ds-cell *dsCellDef="let row">{{ row.laatstGewijzigdDoor }}</td>
  </ng-container>
  <ng-container dsColumnDef="acties">
    <th ds-header-cell *dsHeaderCellDef>{{ strings.algemeen.labels.acties }}</th>
    <td ds-cell *dsCellDef="let row">
      <div class="display-flex gap-2">
        <button ds-button-secondary ds-button-icon *appAutorisatie="inzienConstraint"
                (click)="downloadHandleiding(row.id, row.bestandsnaam)"
                [title]="strings.algemeen.buttons.downloaden" class="mr-2"
                data-testid="handleiding_downloaden">
          <ds-icon [icon]="faDownloadIcon"/>
        </button>
        <button ds-button-secondary ds-button-icon (click)="openHandleidingBewerkenDialog(row.id, row.bestandsnaam)"
                *appAutorisatie="bewerkenConstraint"
                [title]="strings.algemeen.buttons.bewerken"
                class="mr-2" data-testid="handleiding_bewerken">
          <ds-icon [icon]="faPenIcon"/>
        </button>
        <button ds-button-quaternary ds-button-icon (click)="openHandleidingVerwijderenDialog(row.id, row.bestandsnaam)"
                *appAutorisatie="verwijderenConstraint"
                [title]="strings.algemeen.buttons.verwijderen"
                class="mr-2" data-testid="handleiding_verwijderen">
          <ds-icon [icon]="faTrashIcon"/>
        </button>
      </div>
    </td>
  </ng-container>
  <tr ds-header-row *matHeaderRowDef="columnsToDisplay()"></tr>
  <tr ds-row *matRowDef="let _; columns: columnsToDisplay()"></tr>
</table>
