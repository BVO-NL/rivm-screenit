<app-base-dialog [titel]="strings.algemeen.handleidingen.aanmaken.dialogTitle" size="md">
  <form [formGroup]="handleidingForm" body>
    <ds-file-uploader
      class="file-uploader"
      formControlName="handleidingenUpload"
      [options]="fileUploaderOptions"
      [label]="strings.algemeen.handleidingen.aanmaken.uploaderLabel"
      data-testid="handleidingen_uploaden"
    />
    <div>
      @for (handleiding of handleidingen; track handleiding.name; let i = $index) {
        <ds-file-uploader-file
          [file]="handleiding"
          (deleteClicked)="verwijderHandleidingVanLijst(handleiding)"
        />
        <ds-input
          label="Bestandsnaam"
          [errorMessage]="{maxlength: strings.algemeen.errors.maxKarakters('De bestandsnaam', MAX_KARAKTERS.bestandsnaam), minlength: strings.algemeen.errors.minKarakters('De bestandsnaam', 3)}"
          [formControl]="bestandsnamen.at(i)"
          data-testid="bestandsnaam_input"
          required
          minlength="3"
          [dsMaxLength]="MAX_KARAKTERS.bestandsnaam"
        />
      }
    </div>
  </form>
  <ng-container buttons>
    <button (click)="annuleren()" data-testid="annuleren_btn"
            ds-button-tertiary>{{ strings.algemeen.buttons.annuleren }}
    </button>
    <button (click)="opslaan()" data-testid="opslaan_btn" [disabled]="!isFormGeldig"
            ds-button-primary>{{ strings.algemeen.buttons.opslaan }}
    </button>
  </ng-container>
</app-base-dialog>
