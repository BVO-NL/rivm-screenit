<app-base-dialog [titel]="strings.algemeen.clientDossier.acties.aanhefWijzigen.dialogTitle">
  <div body>
    <form [formGroup]="aanhefForm" class="form-in-modal" novalidate>
      <ds-dropdown
        formControlName="aanhef"
        [label]="strings.algemeen.labels.aanspreekvorm"
        [placeholder]="strings.algemeen.clientDossier.acties.aanhefWijzigen.aanspreekvormPlaceholder"
        [items]="aanspreekvormOpties"
        bindLabel="omschrijving"
        bindValue="aanhef"
        appendTo=".ds-modal"
        [required]="true"
        [errorMessage]="{ required: strings.algemeen.errors.verplicht(strings.algemeen.labels.aanspreekvorm) }"
        data-testid="aanspreekvorm_dropdown"
      />
      <app-notitie-aanmaken-veld formControlName="notitie" data-testid="notitie_veld"/>
    </form>
  </div>
  <ng-container buttons>
    <button (click)="annuleren()" data-testid="btn_annuleren" ds-button-tertiary type="button">{{ strings.algemeen.buttons.annuleren }}</button>
    <button (click)="wijzigen()" [disabled]="aanhefForm.invalid" data-testid="btn_wijzigen" ds-button-primary type="button">
      {{ strings.algemeen.clientDossier.acties.aanhefWijzigen.wijzigenButton }}
    </button>
  </ng-container>
</app-base-dialog>
