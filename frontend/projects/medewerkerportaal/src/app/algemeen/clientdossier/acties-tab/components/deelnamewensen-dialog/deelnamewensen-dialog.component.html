<app-base-dialog [titel]="strings.algemeen.clientDossier.acties.deelnamewensen.dialogTitle">
  <div body>
    <form [formGroup]="deelnamewensenForm" class="form-in-modal" novalidate>
      <ds-checkbox-array
        formControlName="deelnamewensen"
        [label]="strings.algemeen.clientDossier.acties.deelnamewensen.deelnamewensenPerBvo"
        [required]="true"
        [errorMessage]="{ geenNieuweSelectie: strings.algemeen.clientDossier.acties.deelnamewensen.errors.geenNieuweDeelnamewens }"
        data-testid="checkbox_array_deelnamewensen"
      />
      <app-notitie-aanmaken-veld formControlName="notitie" [label]="strings.algemeen.labels.notitie" data-testid="notitie_veld"/>
    </form>
  </div>
  <ng-container buttons>
    <button (click)="annuleren()" data-testid="btn_annuleren" ds-button-tertiary type="button">{{ strings.algemeen.buttons.annuleren }}</button>
    <button (click)="opslaan()" [disabled]="deelnamewensenForm.invalid" data-testid="btn_opslaan" ds-button-primary type="button">
      {{ strings.algemeen.buttons.opslaan }}
    </button>
  </ng-container>
</app-base-dialog>
