<app-base-dialog [titel]="strings.algemeen.clientDossier.acties.overdrachtPersoonsgegevens.aanvraagformulierDialog.titel" size="lg">
  <div body>
    <p data-testid="aanvraag_tekst">{{ strings.algemeen.clientDossier.acties.overdrachtPersoonsgegevens.aanvraagformulierDialog.tekst }}</p>
    <app-notitie-aanmaken-veld [formControl]="notitie" data-testid="notitie_veld" />
  </div>
  <ng-container buttons>
    <button (click)="annuleren()" data-testid="btn_annuleren" ds-button-tertiary type="button">{{ strings.algemeen.buttons.annuleren }}</button>
    <button (click)="aanvragen()" data-testid="btn_aanvragen" ds-button-primary type="button">{{ strings.algemeen.buttons.aanvragen }}</button>
  </ng-container>
</app-base-dialog>
