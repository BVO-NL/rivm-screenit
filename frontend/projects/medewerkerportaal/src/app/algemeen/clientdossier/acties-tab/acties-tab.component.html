<app-client-paspoort/>

<div class="actie-cards">
  @if (algemeneActies().actionItems.length > 0) {
    <ds-action-card data-testid="actie_card_algemeen" [actionListModel]="algemeneActies()"/>
  }
  @if (cervixActies().actionItems.length > 0) {
    <ds-action-card data-testid="actie_card_cervix" [actionListModel]="cervixActies()"/>
  }
  @if (mammaActies().actionItems.length > 0) {
    <ds-action-card data-testid="actie_card_mamma" [actionListModel]="mammaActies()"/>
  }
  @if (colonActies().actionItems.length > 0) {
    <ds-action-card data-testid="actie_card_colon" [actionListModel]="colonActies()"/>
  }
</div>
