<app-base-dialog [titel]="uitstelStrings.dialogTitle">
  <div body>
    <form [formGroup]="uitstelForm" novalidate>
      <ds-dropdown
        formControlName="reden"
        [label]="strings.algemeen.labels.reden"
        [placeholder]="uitstelStrings.redenPlaceholder"
        [items]="redenOpties"
        bindLabel="naam"
        bindValue="waarde"
        appendTo=".ds-modal"
        [errorMessage]="{ required: strings.algemeen.errors.verplicht(strings.algemeen.labels.reden) }"
        data-testid="reden_dropdown"
        [clearable]="false"
      />
      @if (uitstelForm.get('reden')?.value) {
        <ds-datepicker
          formControlName="datum"
          [label]="datumLabel"
          [placeholder]="strings.algemeen.placeholders.datum"
          [errorMessage]="{
            required: strings.algemeen.errors.verplicht(datumLabel),
            zwangerschapTeOud: uitstelForm.get('datum')?.errors?.['zwangerschapTeOud'],
            teVerInToekomst: uitstelStrings.errors.teVerInToekomst,
          }"
          data-testid="datum_datepicker"
          [minDate]="minDate"
        />
      }
      <app-notitie-aanmaken-veld formControlName="notitie" data-testid="notitie_veld"/>
    </form>
  </div>
  <ng-container buttons>
    <button (click)="annuleren()" data-testid="btn_annuleren" ds-button-tertiary type="button">{{ strings.algemeen.buttons.annuleren }}</button>
    <button (click)="uitstellen()" data-testid="btn_uitstellen" [disabled]="uitstelForm.invalid" ds-button-primary type="button">{{ strings.algemeen.buttons.uitstellen }}</button>
  </ng-container>
</app-base-dialog>
