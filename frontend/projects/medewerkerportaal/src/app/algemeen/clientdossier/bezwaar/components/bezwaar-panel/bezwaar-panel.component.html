@if (isZichtbaar()) {
  <ds-card [cardTitle]="titel()">
    @if (!opOverzichtPagina()) {
      <ng-template ds-card-header-content>
        <button ds-button-secondary data-testid="overzicht_btn" routerLink="/client/dossier/bezwaar">
          Overzicht
          <ds-icon [icon]="faArrowRight"/>
        </button>
      </ng-template>
    }
    <app-bezwaar-lijst [bezwaarMoment]="actiefBezwaarMoment()" [horizontaal]="opOverzichtPagina()" [subtekst]="subtekst()"/>
  </ds-card>
}
