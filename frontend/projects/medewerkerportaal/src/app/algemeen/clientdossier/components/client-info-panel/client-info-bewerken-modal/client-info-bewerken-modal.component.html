<app-base-dialog size="xl" titel="Contactgegevens aanpassen">
  <div body>
    <ds-summary-panel>
      <div class="row">
        <div class="col">
          <ds-description
            label="Burgerservicenummer"
            value="{{ clientData.bsn }}"/>
          <ds-description
            label="Geboortenaam"
            value="{{ (clientData.tussenvoegsel ? clientData.tussenvoegsel + ' ' : '') + clientData.achternaam }}"/>
        </div>
        <div class="col">
          <ds-description
            label="Geboortedatum"
            value="{{ clientData.geboortedatum | date:NL_DATE_FORMAT }}"/>
          <ds-description
            *appAutorisatie="genderIdentiteitConstraint"
            label="Genderidentiteit"
            value="{{ clientData.geslacht | enumLabel: geslachtLabel }}"/>
        </div>
      </div>
    </ds-summary-panel>
    <form [formGroup]="contactgegevensForm" class="mt-3" novalidate>

      <div class="contactgegevens-inputs" *appAutorisatie="contactgegevensConstraint">
        <ds-input
          label="Mobiel nummer"
          [errorMessage]="{ mobielTelefoon: 'Het mobiele nummer is incorrect.' }"
          formControlName="mobielNummer"
        />
        <ds-input
          label="Extra nummer"
          [errorMessage]="{ telefoon: 'Het telefoonnummer is incorrect.' }"
          formControlName="extraNummer"
        />
        <ds-input
          label="E-mailadres"
          [errorMessage]="{ email: 'Het e-mailadres is incorrect.' }"
          formControlName="emailadres"
        />
      </div>
      <ds-dropdown
        class="contactgegevens-dropdowns" *appAutorisatie="aanspreekvormConstraint"
        label="Aanspreekvorm"
        formControlName="aanspreekvorm"
        [items]="aanspreekvormOpties"
        bindLabel="naam"
        bindValue="waarde"
        appendTo=".ds-modal"
        [clearable]="false"
        data-testid="aanspreekvorm_dropdown"
      />
      <div class="doelgroep-inputs" *appAutorisatie="doelgroepConstraint">
        <ds-dropdown
          label="Doelgroep"
          formControlName="doelgroep"
          [items]="doelgroepOpties"
          bindLabel="naam"
          bindValue="waarde"
          appendTo=".ds-modal"
          data-testid="doelgroep_dropdown"
        >
        </ds-dropdown>
        @if (selectedDoelgroep === Doelgroep.DUBBELE_TIJD) {
          <ds-input
            label="Reden"
            formControlName="dubbelTijdReden"
            [required]="true"
            class="dubbele-tijd-reden"
            maxlength="255"
            [errorMessage]="{required: `Reden is verplicht wanneer doelgroep 'Dubbele tijd' is geselecteerd.`, maxlength: `Reden mag niet meer dan 255 karakters bevatten.`}"
          />
        }
      </div>
    </form>
  </div>
  <ng-container buttons>
    <button (click)="cancel()" data-testid="btn_annuleren" ds-button-tertiary type="button">Annuleren</button>
    <button (click)="save()"
            data-testid="btn_opslaan"
            [disabled]="contactgegevensForm.invalid"
            ds-button-primary>
      Opslaan
    </button>
  </ng-container>
</app-base-dialog>
