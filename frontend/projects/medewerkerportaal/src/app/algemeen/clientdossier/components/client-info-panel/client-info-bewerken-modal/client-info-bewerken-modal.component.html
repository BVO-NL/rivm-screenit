<app-base-dialog size="xl" [titel]="strings.algemeen.clientInfoBewerken.dialogTitle">
  <div body>
    <ds-summary-panel>
      <div class="row">
        <div class="col">
          <ds-description
            [label]="strings.algemeen.labels.bsn"
            value="{{ clientData.bsn }}"/>
          <ds-description
            [label]="strings.algemeen.labels.geboortenaam"
            value="{{ (clientData.tussenvoegsel ? clientData.tussenvoegsel + ' ' : '') + clientData.achternaam }}"/>
        </div>
        <div class="col">
          <ds-description
            [label]="strings.algemeen.labels.geboortedatum"
          value="{{ clientData.geboortedatum | date:NL_DATE_FORMAT }}"/>
        <ds-description
          [label]="strings.algemeen.labels.genderidentiteit"
          *appAutorisatie="genderIdentiteitConstraint"
            value="{{ clientData.geslacht | enumLabel: geslachtLabel }}"/>
        </div>
      </div>
    </ds-summary-panel>
    <form [formGroup]="contactgegevensForm" class="mt-3" novalidate>

      <div class="contactgegevens-inputs" *appAutorisatie="contactgegevensConstraint">
        <ds-input
          [label]="strings.algemeen.labels.mobielNummer"
          [errorMessage]="{ mobielTelefoon: strings.algemeen.errors.invalidMobile }"
          formControlName="mobielNummer"
        />
        <ds-input
          [label]="strings.algemeen.labels.extraNummer"
          [errorMessage]="{ telefoon: strings.algemeen.errors.invalidPhone }"
          formControlName="extraNummer"
        />
        <ds-input
          [label]="strings.algemeen.labels.emailadres"
          [errorMessage]="{ email: strings.algemeen.errors.invalidEmail }"
          formControlName="emailadres"
        />
      </div>
      <ds-dropdown
        class="contactgegevens-dropdowns" *appAutorisatie="aanspreekvormConstraint"
        [label]="strings.algemeen.labels.aanspreekvorm"
        formControlName="aanspreekvorm"
        [items]="aanspreekvormOpties"
        bindLabel="naam"
        bindValue="waarde"
        appendTo=".ds-modal"
        [clearable]="false"
        data-testid="aanspreekvorm_dropdown"
      />
      <div class="doelgroep-inputs" *appAutorisatie="doelgroepConstraint">
        <ds-dropdown
          [label]="strings.algemeen.labels.doelgroep"
          formControlName="doelgroep"
          [items]="doelgroepOpties"
          bindLabel="naam"
          bindValue="waarde"
          appendTo=".ds-modal"
          data-testid="doelgroep_dropdown"
        >
        </ds-dropdown>
        @if (selectedDoelgroep === Doelgroep.DUBBELE_TIJD) {
          <ds-input
            [label]="strings.algemeen.labels.reden"
            formControlName="dubbelTijdReden"
            [required]="true"
            class="dubbele-tijd-reden"
            maxlength="255"
            [errorMessage]="{required: strings.algemeen.errors.verplicht(strings.algemeen.labels.reden), maxlength: strings.algemeen.errors.maxKarakters(strings.algemeen.labels.reden, 255)}"
          />
        }
      </div>
    </form>
  </div>
  <ng-container buttons>
    <button (click)="cancel()" data-testid="btn_annuleren" ds-button-tertiary type="button">{{ strings.algemeen.buttons.annuleren }}</button>
    <button (click)="save()"
            data-testid="btn_opslaan"
            [disabled]="contactgegevensForm.invalid"
            ds-button-primary>
      {{ strings.algemeen.buttons.opslaan }}
    </button>
  </ng-container>
</app-base-dialog>
