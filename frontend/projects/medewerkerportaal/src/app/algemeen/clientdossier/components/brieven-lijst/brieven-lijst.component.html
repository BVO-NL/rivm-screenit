<table ds-table [dataSource]="brieven()" [fullWidth]="true" [trackBy]="trackByBriefId">
  <ng-container dsColumnDef="status">
    <th *dsHeaderCellDef ds-header-cell>Status</th>
    <td *dsCellDef="let row" ds-cell data-testid="brief_status">
      <div>{{ getBriefStatus(row) }}</div>
      @if (row.herdrukBrief) {
        <div class="herdruk">Herdruk van {{ row.herdrukBrief.creatieDatum | date: NL_DATE_FORMAT }}</div>
      }
    </td>
  </ng-container>

  <ng-container dsColumnDef="brieftype">
    <th *dsHeaderCellDef ds-header-cell>Brieftype</th>
    <td *dsCellDef="let row" ds-cell data-testid="brief_type">{{ row.documentNaam }}</td>
  </ng-container>

  <ng-container dsColumnDef="datum">
    <th *dsHeaderCellDef ds-header-cell>Datum/tijd</th>
    <td *dsCellDef="let row" ds-cell data-testid="brief_datum">{{ (row.herdrukBrief?.creatieDatum ?? row.creatieDatum) | datumTijd }}</td>
  </ng-container>

  <tr ds-header-row *dsHeaderRowDef="displayedColumns"></tr>
  <tr ds-row *dsRowDef="let row; columns: displayedColumns" data-testid="bezwaar_brief_rij"></tr>
</table>
