@if (veldZichtbaar()) {
  @if (gebruikExterneLabel()) {
    <div class="notitie-aanmaken-veld-label" data-testid="notitie-aanmaken-veld-label">
      {{ externeLabel() }}
    </div>
  }
  <ds-textarea
    [label]="interneLabel()"
    [ngModel]="value"
    (ngModelChange)="onUpdate($event)"
    [disabled]="isDisabled"
    data-testid="notitie-aanmaken-veld-textarea"
  />
} @else {
  <button ds-button-tertiary [disabled]="isDisabled" (click)="toonVeld()" data-testid="notitie-aanmaken-veld-knop">
    <ds-icon [icon]="faPlus"/>
    Notitie toevoegen
  </button>

}
