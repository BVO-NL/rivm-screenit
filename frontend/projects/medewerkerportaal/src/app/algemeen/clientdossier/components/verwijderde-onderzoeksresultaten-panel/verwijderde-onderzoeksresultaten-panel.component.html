<ds-card cardTitle="Verwijderde onderzoeksresultaten">
  <table ds-table [dataSource]="onderzoeksresultaten()" [fullWidth]="true">
    <ng-container dsColumnDef="bevolkingsonderzoek">
      <th *dsHeaderCellDef ds-header-cell>Bevolkingsonderzoek</th>
      <td *dsCellDef="let row" ds-cell>{{ row.bevolkingsonderzoek | bvoLabel }}</td>
    </ng-container>

    <ng-container dsColumnDef="datum">
      <th *dsHeaderCellDef ds-header-cell>Datum/tijd</th>
      <td *dsCellDef="let row" ds-cell>{{ row.moment | datumTijd }}</td>
    </ng-container>

    <ng-container dsColumnDef="bekijken">
      <th *dsHeaderCellDef ds-header-cell></th>
      <td *dsCellDef="let row" ds-cell>
        <button ds-button-tertiary (click)="bekijkOnderzoeksresultaten(row)"
                data-testid="bekijk_onderzoeksresultaten_btn">
          Bekijken
        </button>
      </td>
    </ng-container>

    <tr ds-header-row *dsHeaderRowDef="displayedColumns"></tr>
    <tr ds-row *dsRowDef="let row; columns: displayedColumns"></tr>
  </table>
</ds-card>
