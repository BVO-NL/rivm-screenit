<app-base-dialog size="lg" [titel]="strings.algemeen.brpBewerken.dialogTitle">
  <div body>
    <h2 class="brp-ondertitel">{{ strings.algemeen.brpBewerken.tijdelijkAdresHeading }}</h2>

    <form [formGroup]="brpGegevensForm" class="form-in-modal" novalidate>
      <ds-input
        [label]="strings.algemeen.labels.straatnaam"
        formControlName="straat"
        [placeholder]="strings.algemeen.labels.straatnaam"
        [errorMessage]="{maxlength: strings.algemeen.errors.maxKarakters('Straatnaam', 56)}"
      />
      <div class="huisnummer-groep">
        <ds-input
          [label]="strings.algemeen.labels.huisnummer"
          formControlName="huisnummer"
          type="number"
          [placeholder]="strings.algemeen.labels.huisnummer"
          id="huisnummer"
          maxlength="10"
          [errorMessage]="{ maxlength: strings.algemeen.errors.maxKarakters('Huisnummer', 10), pattern: strings.algemeen.errors.huisnummerAlleenCijfers }"
          [required]="true"
        />
        <ds-input
          [label]="strings.algemeen.labels.huisletter"
          formControlName="huisletter"
          placeholder="A"
          id="huisletter"
          [errorMessage]="{ maxlength: strings.algemeen.errors.maxKarakters('Huisletter', 1) }"
          maxlength="1"
        />
        <ds-input
          [label]="strings.algemeen.labels.toevoeging"
          formControlName="huisnummerToevoeging"
          [placeholder]="strings.algemeen.labels.toevoeging"
          id="huisnummerToevoeging"
          [errorMessage]="{ maxlength: strings.algemeen.errors.maxKarakters('Toevoeging', 26) }"
          maxlength="26"
        />
        <ds-input
          [label]="strings.algemeen.labels.aanduiding"
          formControlName="huisnummerAanduiding"
          id="aanduidingBijHuisnummer"
          [errorMessage]="{ maxlength: strings.algemeen.errors.maxKarakters('Aanduiding', 2) }"
          maxlength="2"
        />
      </div>
      <div class="postcode-plaats-groep">
        <ds-input
          [label]="strings.algemeen.labels.postcode"
          formControlName="postcode"
          id="postcode"
          [placeholder]="strings.algemeen.labels.postcode"
          [errorMessage]="strings.algemeen.errors.invalidPostcode"
          [required]="true"
        />
        <ds-input
          [label]="strings.algemeen.labels.plaats"
          formControlName="plaats"
          [placeholder]="strings.algemeen.labels.plaats"
          id="plaats"
          maxlength="200"
          [errorMessage]="{ maxlength: strings.algemeen.errors.maxKarakters('Plaats', 200) }"
          [required]="true"
        />
      </div>
    </form>
  </div>
  @if (tijdelijkAdres()) {
    <ng-container verwijder-button>
      <button
        *appAutorisatie="verwijderConstraint"
        (click)="deleteBrpTijdelijkAdres()"
        data-testid="btn-verwijderen"
        type="button"
        ds-button-delete>
        {{ strings.algemeen.brpBewerken.adresVerwijderenButton }}
      </button>
    </ng-container>
  }
  <ng-container buttons>
    <button (click)="cancel()" data-testid="btn_annuleren" ds-button-tertiary type="button">{{ strings.algemeen.buttons.annuleren }}</button>
    <button (click)="save()"
            data-testid="btn_opslaan"
            [disabled]="brpGegevensForm.invalid"
            ds-button-primary>
      {{ strings.algemeen.buttons.opslaan }}
    </button>
  </ng-container>
</app-base-dialog>
