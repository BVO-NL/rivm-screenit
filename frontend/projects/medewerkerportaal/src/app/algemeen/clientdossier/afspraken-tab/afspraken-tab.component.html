<app-client-paspoort/>

<div class="afspraken-panels">
  <app-afspraak-panel [afspraakEnActies]="mammaAfspraakEnActies()" [bvo]="Bevolkingsonderzoek.MAMMA" (tijdstipWijzigen)="tijdstipWijzigenAfspraak.set($event)"/>
  <app-afspraak-panel [afspraakEnActies]="colonAfspraakEnActies()" [bvo]="Bevolkingsonderzoek.COLON" (tijdstipWijzigen)="tijdstipWijzigenAfspraak.set($event)"/>
</div>

@if (tijdstipWijzigenAfspraak() !== null) {
  <app-colon-client-afspraak-verplaatsen [afspraak]="tijdstipWijzigenAfspraak()" (sluiten)="afspraakTijdstipSluiten()"/>
}
