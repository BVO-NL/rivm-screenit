<ds-fullscreen-wizard [header]="titel()" (wizardClosed)="sluitWizard()" [stepsAreSkippable]="false" [detailedStepper]="true">
  <ds-wizard-step [title]="steps().AFSPRAAK_KIEZEN.titel"
                  [subtitle]="steps().AFSPRAAK_KIEZEN.subtitel"
                  [nextAction]="steps().AFSPRAAK_KIEZEN.nextAction"
                  [cancelAction]="steps().AFSPRAAK_KIEZEN.cancelAction"
                  [stepControl]="steps().AFSPRAAK_KIEZEN.stepControl"
  >
    <app-colon-client-afspraak-zoeken [afspraakDialogMode]="afspraakDialogMode()" [huidigeIntakelocatieId]="afspraak()?.locatie?.id ?? null"
                                      (slotGekozen)="selecteerSlot($event)" (datumTijdBuitenRoosterChange)="wijzigDatumTijdBuitenRooster($event)"
                                      [(afspraakType)]="gekozenAfspraakType"/>
  </ds-wizard-step>
  <ds-wizard-step [title]="steps().AFSPRAAK_BEVESTIGEN.titel"
                  [subtitle]="steps().AFSPRAAK_BEVESTIGEN.subtitel"
                  [nextAction]="steps().AFSPRAAK_BEVESTIGEN.nextAction"
                  [cancelAction]="steps().AFSPRAAK_BEVESTIGEN.cancelAction"
                  [previousAction]="steps().AFSPRAAK_BEVESTIGEN.previousAction"
                  [stepControl]="steps().AFSPRAAK_BEVESTIGEN.stepControl">
    <app-colon-client-afspraak-bevestiging [afspraakDialogMode]="afspraakDialogMode()" [afspraakslot]="geselecteerdSlot()" [huidigeAfspraak]="afspraak()"
                                           [afspraakType]="gekozenAfspraakType()"
                                           [(request)]="aanmakenRequest"/>
  </ds-wizard-step>
  <ds-wizard-step [title]="steps().SAMENVATTING.titel"
                  [subtitle]="steps().SAMENVATTING.subtitel"
                  [cancelAction]="steps().SAMENVATTING.cancelAction"
                  [previousAction]="steps().SAMENVATTING.previousAction"
                  [completeAction]="steps().SAMENVATTING.completeAction">
    <app-colon-client-afspraak-samenvatting [request]="aanmakenRequest()"/>
  </ds-wizard-step>
</ds-fullscreen-wizard>
