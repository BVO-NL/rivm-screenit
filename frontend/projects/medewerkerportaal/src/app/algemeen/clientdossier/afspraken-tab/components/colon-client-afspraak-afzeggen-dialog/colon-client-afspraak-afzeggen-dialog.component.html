<app-base-dialog [titel]="strings.algemeen.afspraken.afzeggen.dialogTitle" size="lg">
  <div body>
    <ds-summary-panel headertitle="Afspraakgegevens">
      <div class="row">
        <div class="col afspraak-gegevens-kolom">
          <ds-description [label]="strings.algemeen.labels.betreft" value="Intakeafspraak"/>
          <ds-description [label]="strings.algemeen.labels.datumTijd"
                          [value]="isDigitaalAfspraak(afspraak) ? (afspraak.vanaf | datumNaarWeek) : (afspraak.vanaf | datumTijd)"/>
        </div>
        <div class="col">
          <ds-description [label]="strings.algemeen.labels.intakelocatie" [value]="afspraak.locatie.naam"/>
        </div>
      </div>
    </ds-summary-panel>
    <ds-checkbox
      *appAutorisatie="brievenTegenhoudenConstraint"
      class="geen-bevestigingsbrief"
      [formControl]="briefTegenhoudenCtrl"
      data-testid="checkbox_geen_bevestigingsbrief">
      {{ strings.algemeen.afspraken.geenBriefSturen }}
    </ds-checkbox>
    <app-notitie-aanmaken-veld class="notitie" [formControl]="notitieCtrl" data-testid="notitie"/>
  </div>
  <ng-container buttons>
    <button (click)="annuleren()" data-testid="btn_annuleren" ds-button-tertiary type="button">{{ strings.algemeen.buttons.annuleren }}</button>
    <button (click)="afzeggen()" [disabled]="notitieCtrl.invalid" data-testid="btn_afzeggen" ds-button-primary type="button">{{ strings.algemeen.buttons.afzeggen }}</button>
  </ng-container>
</app-base-dialog>
