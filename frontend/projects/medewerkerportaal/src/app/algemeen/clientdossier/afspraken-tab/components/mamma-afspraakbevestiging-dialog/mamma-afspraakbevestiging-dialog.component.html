<app-base-dialog [titel]="strings.algemeen.afspraken.mamma.afspraakbevestigingDialog.titel" size="lg">
  <div body>
    @if (briefAlVerstuurd) {
      <ds-contextual-notifications [context]="context" class="display-block mb-3" data-testid="afspraakbevestiging_melding"/>
    } @else if (keuze() === 'BRIEF') {
      <app-brief-adres-informatiebalk [postadres]="postadres" class="display-block mb-3"/>
    }
    <form [formGroup]="form" novalidate>
      <ds-radiobutton class="zonder-validatie" [columnCount]="1" [items]="keuzeOpties" formControlName="keuze" [required]="true"
                      [label]="strings.algemeen.afspraken.mamma.afspraakbevestigingDialog.keuze" data-testid="bevestiging_keuze"/>
      @if (keuze() === 'EMAIL') {
        <ds-input class="display-block mt-3" formControlName="emailadres" type="email" [label]="strings.algemeen.labels.emailadres"
                  [errorMessage]="emailadresFouten" data-testid="emailadres"/>
      }
    </form>
  </div>
  <ng-container buttons>
    <button (click)="annuleren()" data-testid="btn_annuleren" ds-button-tertiary type="button">{{ strings.algemeen.buttons.annuleren }}</button>
    <button (click)="versturen()" data-testid="btn_versturen" ds-button-primary type="button">{{ strings.algemeen.buttons.versturen }}</button>
  </ng-container>
</app-base-dialog>
