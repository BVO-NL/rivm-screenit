<table ds-table [dataSource]="afspraakslots()" [fullWidth]="true" matSort>
  <ng-container dsColumnDef="datum">
    <th *dsHeaderCellDef ds-header-cell mat-sort-header="vanaf">Datum</th>
    <td *dsCellDef="let row" ds-cell>{{ row.startTijd | date: NL_DATE_FORMAT }}</td>
  </ng-container>

  <ng-container dsColumnDef="tijd">
    <th *dsHeaderCellDef ds-header-cell>Tijd</th>
    <td *dsCellDef="let row" ds-cell>{{ row.startTijd | date: TIME_FORMAT }}</td>
  </ng-container>

  <ng-container dsColumnDef="naam">
    <th *dsHeaderCellDef ds-header-cell mat-sort-header="naam">Naam</th>
    <td *dsCellDef="let row" ds-cell>{{ row.naam }}</td>
  </ng-container>

  <ng-container dsColumnDef="plaats">
    <th *dsHeaderCellDef ds-header-cell mat-sort-header="plaats">Plaats</th>
    <td *dsCellDef="let row" ds-cell>{{ row.plaats }}</td>
  </ng-container>

  <ng-container dsColumnDef="actie">
    <th *dsHeaderCellDef ds-header-cell>Actie</th>
    <td *dsCellDef="let row" ds-cell>
      <button ds-button-secondary (click)="selecteerSlot.emit(row)" data-testid="selecteer-slot-knop">Selecteren</button>
    </td>
  </ng-container>

  <tr ds-header-row *dsHeaderRowDef="displayedColumns"></tr>
  <tr ds-row *dsRowDef="let row; columns: displayedColumns"></tr>
</table>

<ds-paginator [totalNumberOfItems]="paginering().totaal"
              [pageSize]="paginering().paginaGrootte"
              [pageSizeOptions]="[10, 20, 50]"
              (pageChanged)="handlePageChange($event)"
></ds-paginator>
