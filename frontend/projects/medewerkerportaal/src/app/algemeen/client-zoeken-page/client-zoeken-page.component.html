<ds-page-header [title]="strings.algemeen.clientZoeken.pageTitle" [showBackButton]="false"/>

<app-client-zoeken-filter (zoeken)="zoekClienten($event)"/>
<div class="inhoud">
  @if (heeftGezocht()) {
    <app-client-zoeken-tabel [clienten]="clienten()" (navigate)="navigeerNaarClient($event)"/>
  } @else {
    <div class="zoek-placeholder-container">
      <div class="zoek-placeholder">
        <ds-icon [icon]="gebruikerIcoon" size="xl"/>
        <span class="zoek-placeholder-titel">{{ strings.algemeen.clientZoeken.zoekPlaceholder }}</span>
        <p class="zoek-placeholder-tekst">
          @if (filterComponent()?.geavanceerdZoekenActief()) {
            {{ strings.algemeen.clientZoeken.instructieGeavanceerd }}
          } @else {
            {{ strings.algemeen.clientZoeken.instructieStandaard }}
          }
        </p>
      </div>
    </div>
  }
</div>
