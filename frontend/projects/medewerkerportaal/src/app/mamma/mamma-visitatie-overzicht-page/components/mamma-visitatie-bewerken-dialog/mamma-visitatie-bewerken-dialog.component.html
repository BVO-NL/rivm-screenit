<app-base-dialog [titel]="strings.mamma.visitatie.bewerken.dialogTitle" size="lg">
  <form [formGroup]="editForm" body class="ds-visitatie-form-grid">
    <div class="visitatie-bestanden-upload">
      <div class="helft-width visitatie-form-links">
        <ds-input
          [label]="strings.algemeen.labels.omschrijving"
          formControlName="omschrijving"
          [placeholder]="strings.algemeen.labels.omschrijving"
          data-testid="input_omschrijving"
          required
          type="text"
        ></ds-input>

        <ds-dropdown
          [label]="strings.algemeen.labels.status"
          formControlName="status"
          [items]="mammaVisitatieStatusLijst"
          bindValue="waarde"
          bindLabel="naam"
          appendTo=".ds-modal"
          data-testid="status_dropdown"
          [clearable]="false"
        />

        @if (visitatieTypeBe) {
          <ds-dropdown
            [label]="strings.mamma.labels.beoordelingseenheid"
            formControlName="beoordelingseenheid"
            [clearable]="beoordelingseenheidCtrl.hasValidator(Validators.required)"
            [items]="beoordelingseenheden()"
            appendTo=".ds-modal"
            bindLabel="naam"
            data-testid="beoordelingseenheid_dropdown"
          />
        }

        <app-single-file-selector
          [required]="false"
          formControlName="rapportage"
          acceptedExtensie="xlsx"
          data-testid="rapportage_input"
          [label]="strings.mamma.labels.rapportage"
        />

        <app-single-file-selector
          [required]="false"
          formControlName="vragenlijst"
          acceptedExtensie="xlsx"
          data-testid="vragenlijst_input"
          [label]="strings.mamma.labels.vragenlijst"
        />
      </div>

      <div class="helft-width visitatie-form-rechts">
        @if (isNieuw && !visitatieTypeBe) {
          <app-single-file-selector
            [required]="false"
            formControlName="insteltechniek"
            acceptedExtensie="csv"
            data-testid="insteltechniek_input"
            [label]="strings.mamma.labels.insteltechniek"
            class="insteltechniek_input"
          ></app-single-file-selector>
          <ds-radiobutton
            [label]="strings.mamma.labels.fotorichting"
            formControlName="fotorichting"
            [items]="getFotorichtingRadioItems()"
            name="fotorichting"
            data-testid="fotorichting_input_radio"
          ></ds-radiobutton>
        }

        @if (isNieuw && visitatieTypeBe) {
          <app-single-file-selector
            [required]="false"
            formControlName="intervalcarcinomen"
            acceptedExtensie="csv"
            data-testid="intervalcarcinomen_input"
            [label]="strings.mamma.labels.intervalcarcinomen"
          ></app-single-file-selector>

          <app-single-file-selector
            [required]="false"
            formControlName="verwijzingen"
            acceptedExtensie="csv"
            data-testid="verwijzingen_input"
            [label]="strings.mamma.labels.verwijzingen"
          ></app-single-file-selector>

          <app-single-file-selector
            [required]="false"
            formControlName="screenDetected"
            acceptedExtensie="csv"
            data-testid="screen_detected_input"
            [label]="strings.mamma.labels.t2ScreenDetected"
          ></app-single-file-selector>

          <app-single-file-selector
            [required]="false"
            formControlName="protheses"
            acceptedExtensie="csv"
            data-testid="protheses_input"
            [label]="strings.mamma.labels.protheses"
          ></app-single-file-selector>
        }
      </div>
    </div>
  </form>

  <ng-container buttons>
    <button ds-button-tertiary (click)="sluitDialog()"
            data-testid="annuleren_btn">{{ strings.algemeen.buttons.annuleren }}
    </button>
    <button ds-button-primary (click)="opslaan()" data-testid="opslaan_btn">{{ strings.algemeen.buttons.opslaan }}
    </button>
  </ng-container>
</app-base-dialog>
