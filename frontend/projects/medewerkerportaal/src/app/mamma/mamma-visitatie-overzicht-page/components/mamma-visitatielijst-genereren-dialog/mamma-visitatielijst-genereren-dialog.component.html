<app-base-dialog [titel]="strings.mamma.visitatielijstGenereren.dialogTitle">
  <form [formGroup]="genererenForm" body>
    <ds-input [label]="strings.algemeen.labels.omschrijving" formControlName="omschrijving"
              data-testid="input_omschrijving"/>

    <app-single-file-selector [label]="strings.algemeen.labels.bestand"
                              formControlName="bestand"
                              acceptedExtensie="csv"
                              id="bestand"
                              [required]="true"
                              data-testid="bestand_input"
    />
  </form>

  <ng-container buttons>
    <button ds-button-tertiary (click)="sluitDialog()"
            data-testid="annuleren_btn">{{ strings.algemeen.buttons.annuleren }}
    </button>
    <button ds-button-primary (click)="rapportGenereren()"
            data-testid="genereren_btn">{{ strings.mamma.visitatielijstGenereren.generateButton }}
    </button>
  </ng-container>
</app-base-dialog>
