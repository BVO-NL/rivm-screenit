<app-base-dialog [titel]="strings.mamma.visitatie.verwijderen.dialogTitle">
  <div body class="body">
    <div class="mb-2">{{ strings.mamma.visitatie.verwijderen.body }}</div>
    <table>
      <tr>
        <td>{{ strings.algemeen.labels.omschrijving }}</td>
        <td>{{ visitatie.omschrijving }}</td>
      </tr>
      <tr>
        <td>{{ strings.algemeen.labels.aangemaaktDoor }}</td>
        <td>{{ visitatie.aangemaaktDoor }}</td>
      </tr>
    </table>
  </div>
  <ng-container buttons>
    <button ds-button-tertiary type="button" (click)="sluitDialog()"
            data-testid="annuleren_button">{{ strings.algemeen.buttons.annuleren }}
    </button>
    <button ds-button-delete-primary type="button" (click)="bevestigVerwijderen()"
            data-testid="verwijderen_button">{{ strings.algemeen.buttons.verwijderen }}
    </button>
  </ng-container>
</app-base-dialog>
