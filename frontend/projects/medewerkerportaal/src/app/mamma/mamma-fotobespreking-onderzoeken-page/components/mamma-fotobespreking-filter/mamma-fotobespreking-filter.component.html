<form class="row" [formGroup]="filterForm">
  <ds-card [cardTitle]="strings.mamma.fotobespreking.labels.periodeMedewerkerTitle" class="col-md-3 col-12">
    <ds-range-datepicker [inForm]="true" [minDate]="onderzoekMinDatum" [label]="strings.mamma.labels.onderzoeksdatum"
                         formControlName="onderzoeksdatum"/>
    <ds-dropdown [label]="strings.algemeen.labels.medewerker" [inForm]="true" [items]="medewerkers()" bindLabel="naam"
                 bindValue="id" appendTo="body"
                 formControlName="medewerkerId"/>
    <ds-dropdown
      [label]="strings.mamma.labels.beoordelingseenheden"
      formControlName="beoordelingseenheidIds"
      [items]="beoordelingseenheden()"
      [multiple]="true"
      [inForm]="true"
      appendTo="body"
      bindValue="id"
      bindLabel="naam"
      data-testid="beoordelingseenheden-combobox"
    />

    <ds-dropdown
      [label]="strings.mamma.labels.screeningseenheden"
      formControlName="screeningseenheidIds"
      [items]="screeningseenheden()"
      [multiple]="true"
      [inForm]="true"
      appendTo="body"
      bindValue="id"
      bindLabel="naam"
      data-testid="screeningseenheden-combobox"
    />
  </ds-card>

  <ds-card [cardTitle]="strings.mamma.fotobespreking.labels.specificatiesTitle" class="col-md-6 col-12">
    <div class="row">
      <div class="col-6">
        <ds-dropdown [multiple]="true" bindLabel="naam" bindValue="waarde"
                     [items]="filterOpties().redenFotobesprekingDoorMbber" [inForm]="true" appendTo="body"
                     formControlName="redenFotobesprekingDoorMbber"
                     [label]="strings.mamma.fotobespreking.labels.redenMbber"/>
        <ds-dropdown [multiple]="true" bindLabel="naam" bindValue="waarde"
                     [items]="filterOpties().redenFotobesprekingDoorRadioloog" [inForm]="true" appendTo="body"
                     formControlName="redenFotobesprekingDoorRadioloog"
                     [label]="strings.mamma.fotobespreking.labels.redenRadioloog"/>
        <ds-dropdown [multiple]="true" bindLabel="naam" bindValue="waarde"
                     [items]="filterOpties().redenFotobesprekingMetMbber" [inForm]="true" appendTo="body"
                     formControlName="redenFotobesprekingMetMbber"
                     [label]="strings.mamma.fotobespreking.labels.redenMetMbber"/>
      </div>
      <div class="col-6">
        <ds-dropdown [multiple]="true" bindLabel="naam" bindValue="waarde" [items]="filterOpties().redenDoorverwijzing"
                     [inForm]="true" appendTo="body"
                     formControlName="redenDoorverwijzing"
                     [label]="strings.mamma.fotobespreking.labels.redenDoorverwijzing"/>
        <ds-dropdown [multiple]="true" bindLabel="naam" bindValue="waarde" [items]="filterOpties().followUp"
                     [inForm]="true" appendTo="body" formControlName="followUp"
                     [label]="strings.mamma.labels.followUp"/>
      </div>
    </div>
  </ds-card>

  <ds-card [cardTitle]="strings.algemeen.labels.client" class="col-md-3 col-12">
    <ds-input [inForm]="true" [label]="strings.algemeen.labels.bsn" formControlName="bsn"/>
    <ds-datepicker [inForm]="true" [label]="strings.algemeen.labels.geboortedatum" formControlName="geboortedatum"/>
  </ds-card>
</form>

<div class="actions-right">
  <button type="submit" ds-button-primary (click)="zoeken()" data-testid="zoeken_btn">Zoeken</button>
</div>
