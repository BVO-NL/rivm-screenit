<ds-page-header [title]="strings.colon.weekendWerkdag.pageTitle" [showBackButton]="false"/>
<form [formGroup]="beperkingForm" (ngSubmit)="save()" class="inhoud">
  <ds-card [cardTitle]="strings.colon.weekendWerkdag.tijdsbeperkingTitle" class="mb-3 display-block">
    <app-colon-rooster-beperking [required]="true" formControlName="nachtBeperkingType"
                                 [label]="strings.colon.weekendWerkdag.labels.beperking"/>
    <div class="nacht-beperking-row">
      <app-timepicker formControlName="nachtBeperkingEindDisabled"
                      [label]="strings.colon.weekendWerkdag.labels.ochtend"/>
      <app-timepicker [required]="true" data-testid="input_nacht_beperking_eind"
                      formControlName="nachtBeperkingEind" id="ochtend"/>
    </div>
    <div class="nacht-beperking-row">
      <app-timepicker [required]="true"
                      formControlName="nachtBeperkingBegin"
                      data-testid="input_nacht_beperking_start" [label]="strings.colon.weekendWerkdag.labels.avond">
      </app-timepicker>
      <app-timepicker formControlName="nachtBeperkingBeginDisabled"></app-timepicker>
    </div>
  </ds-card>

  <ds-card [cardTitle]="strings.colon.weekendWerkdag.weekendbeperkingTitle" class="mb-4 display-block">
    <app-colon-rooster-beperking [required]="true" formControlName="zaterdagBeperkingType"
                                 [label]="strings.colon.weekendWerkdag.labels.zaterdag"/>
    <app-colon-rooster-beperking [required]="true" formControlName="zondagBeperkingType"
                                 [label]="strings.colon.weekendWerkdag.labels.zondag"/>
  </ds-card>

  <button ds-button-primary type="submit" *appAutorisatie="constraint"> {{ strings.algemeen.buttons.opslaan }}</button>
</form>
