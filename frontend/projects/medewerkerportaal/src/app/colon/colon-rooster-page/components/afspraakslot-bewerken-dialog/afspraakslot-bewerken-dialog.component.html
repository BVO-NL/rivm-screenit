<app-base-dialog [size]="isNieuw ? 'xl' : 'md'" [titel]="title">
  <form [formGroup]="afspraakslotForm" body class="row form-in-modal" novalidate>
    <div class="col">
      <app-kamer-selector [required]="true" formControlName="kamer" [inclusiefAlleKamers]="false"/>
      <ds-datepicker
        [errorMessage]="{required: strings.algemeen.errors.verplicht('De datum'), invalidDate: strings.algemeen.errors.invalidDate}"
        [minDate]="minDatum"
        formControlName="datum"
        [label]="strings.algemeen.labels.datum"/>
      @if (isNieuw) {
        <ds-input
          [errorMessage]="{required: strings.algemeen.errors.verplicht('Het aantal afspraakslots')}"
          [label]="'Aantal afspraakslots (van ' + instellingen().duurAfspraakInMinuten + ' minuten)'"
          formControlName="aantalBlokken"
          minValue="1"
          type="number"
        />
      }

      <div class="tijd-grid">
        <app-timepicker
          [required]="true"
          formControlName="vanaf"
          [label]="strings.algemeen.labels.starttijd"
        />
        <app-timepicker
          formControlName="tot"
          [label]="strings.algemeen.labels.eindtijd"
        />
      </div>
    </div>
    @if (isNieuw) {
      <app-bulk-aanmaken class="col" formControlName="herhaling"/>
    }
  </form>
  <ng-container verwijder-button>
    @if (verwijderenToegestaan) {
      <button (click)="confirmDeleteSlot()"
              data-testid="btn-verwijderen"
              ds-button-delete>
        {{ strings.algemeen.buttons.verwijderen }}
      </button>
    }
  </ng-container>
  <ng-container buttons>

    <button (click)="cancel()" data-testid="btn_annuleren" ds-button-tertiary
            type="button">{{ bewerkenToegestaan ? strings.algemeen.buttons.annuleren : strings.algemeen.buttons.sluiten }}
    </button>
    @if (bewerkenToegestaan) {
      <button (click)="save()"
              [disabled]="afspraakslotForm.invalid"
              data-testid="btn_opslaan"
              ds-button-primary>
        {{ strings.algemeen.buttons.opslaan }}
      </button>
    }
  </ng-container>
</app-base-dialog>
