<div class="toolbar">
  <form [formGroup]="filterForm">
    <div class="display-flex gap-3">
      <app-kamer-selector [required]="true" formControlName="kamerId" data-testid="cb_kamer_selector"
                          [inclusiefAlleKamers]="true"/>
      <ds-weekday-selector [required]="true" [label]="strings.algemeen.labels.dagen" formControlName="dagen"
                           data-testid="tds_weekdagen_selector"/>
    </div>

    <div class="display-flex justify-content-between align-items-center">
      <div class="datum-tijd-grid">
        <ds-datepicker [label]="strings.algemeen.labels.vanaf" [required]="true" formControlName="startDatum"
                       [minDate]="minDatum"/>
        <ds-datepicker
          [label]="strings.algemeen.labels.totEnMet"
          [required]="true"
          formControlName="eindDatum"
          [minDate]="startDatumCtrl.value?.toISOString()"
          [errorMessage]="{ lessThanMinDate: strings.algemeen.errors.veldVoorVeld('De Vanaf datum', 'de Tot en met datum') }"
        />

        <app-timepicker label="Starttijd" [required]="true" formControlName="startTijd" data-testid="start_tijd_input"/>
        <app-timepicker label="Eindtijd" [required]="true" formControlName="eindTijd" data-testid="eind_tijd_input"/>
        <ds-checkbox formControlName="heleDag" class="align-self-end pb-1">{{ strings.colon.rooster.labels.heleDag }}
        </ds-checkbox>
      </div>
      <button ds-button-primary (click)="doFilter()" class="filter-btn" [disabled]="filterForm.invalid">Filteren
      </button>
    </div>
  </form>
</div>
