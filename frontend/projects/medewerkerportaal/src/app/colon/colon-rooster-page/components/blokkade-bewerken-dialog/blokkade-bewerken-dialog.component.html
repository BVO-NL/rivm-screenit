<app-base-dialog [size]="isNieuw ? 'xl' : 'lg'" [titel]="title">
  <form [formGroup]="blokkadeForm" body class="form-in-modal" novalidate>
    <div class="blokkade-layout">
      <div class="blokkade-kolom-links">
        <div class="blokkade-form-grid">
          <app-kamer-selector formControlName="kamer" [required]="!alleKamersCtrl.value" [inclusiefAlleKamers]="false"/>

          @if (isNieuw) {
            <ds-checkbox
              class="grid-alle-kamers"
              data-testid="checkbox_alle_kamers"
              formControlName="alleKamers">
              {{ strings.colon.rooster.labels.alleKamers }}
            </ds-checkbox>
          }

          <ds-datepicker
            [minDate]="minDatum"
            class="grid-datum"
            data-testid="input_datum"
            formControlName="datum"
            [label]="strings.algemeen.labels.datum"
          />

          <ds-checkbox class="grid-hele-dag" data-testid="checkbox_hele_dag"
                       formControlName="heleDag">{{ strings.colon.rooster.labels.heleDag }}
          </ds-checkbox>

          <div class="grid-starteindtijd">
            <app-timepicker
              data-testid="input_start_tijd"
              formControlName="vanaf"
              [label]="strings.algemeen.labels.starttijd"
              [required]="!heleDagCtrl.value"
            />

            <app-timepicker
              data-testid="input_eind_tijd"
              formControlName="tot"
              [label]="strings.algemeen.labels.eindtijd"
              [required]="!heleDagCtrl.value"
            />
          </div>

          <ds-input
            [errorMessage]="{required: strings.algemeen.errors.verplicht('Omschrijving')}"
            class="grid-omschrijving"
            data-testid="input_omschrijving"
            formControlName="omschrijving"
            [label]="strings.algemeen.labels.omschrijving"
            required
            type="text"
          />
        </div>
      </div>
      @if (isNieuw) {
        <div class="blokkade-kolom-rechts">
          <app-bulk-aanmaken class="grid-herhalen" formControlName="herhaling"/>
        </div>
      }

    </div>
  </form>
  @if (verwijderenToegestaan) {
    <button verwijder-button (click)="confirmDelete()" data-testid="btn-verwijderen" ds-button-delete
            type="button">{{ strings.algemeen.buttons.verwijderen }}
    </button>
  }
  <ng-container buttons>
    <button (click)="cancel()" data-testid="btn_annuleren" ds-button-tertiary
            type="button">{{ bewerkenToegestaan ? strings.algemeen.buttons.annuleren : strings.algemeen.buttons.sluiten }}
    </button>
    @if (bewerkenToegestaan) {
      <button (click)="save()" [disabled]="blokkadeForm.invalid" data-testid="btn_opslaan" ds-button-primary
              type="button">{{ strings.algemeen.buttons.opslaan }}
      </button>
    }
  </ng-container>
</app-base-dialog>
