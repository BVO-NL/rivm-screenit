<ds-card cardTitle="Adresgegevens">
  <ng-template ds-card-header-content *appAutorisatie="adresgegevensWijzigenConstraint">
    <button ds-button-tertiary (click)="openAdresgegevensBewerkenModal()" data-testid="bewerken_btn">
      <ds-icon [icon]="faPencil"/>
      Bewerken
    </button>
  </ng-template>
  @if (client(); as client) {
    <div class="adresgegevens">
      <div class="row">
        <span class="col-4">Straatnaam en huisnummer</span>
        <span class="col-6">{{ client.volledigeAdres | legeWaarde }}</span>
      </div>
      <div class="row">
        <span class="col-4">Postcode</span>
        <span class="col-6">{{ client.postcode }}</span>
      </div>
      <div class="row">
        <span class="col-4">Woonplaats</span>
        <span class="col-6">{{ client.plaats }}</span>
      </div>
      <div class="row">
        <span class="col-4">Tijdelijk adres</span>
        <span class="col-6">{{ client.tijdelijkAdresVolledig | legeWaarde }}</span>
      </div>
      <div class="row">
        <span class="col-4">Postadres</span>
        <span class="col-6">{{ client.postadres | legeWaarde }}</span>
      </div>
    </div>
  }
</ds-card>
