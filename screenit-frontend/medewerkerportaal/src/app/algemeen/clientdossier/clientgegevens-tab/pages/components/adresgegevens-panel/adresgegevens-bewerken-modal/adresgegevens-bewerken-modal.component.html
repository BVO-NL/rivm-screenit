<app-base-dialog size="lg" titel="Adresgegevens aanpassen">
  <div body>
    <div class="huidig-adres-blok">
      <div class="col">
        <ds-description
          label="Straatnaam"
          value="{{ huidigAdres.volledigeAdres }}"/>
        <ds-description
          label="Woonplaats"
          value="{{ huidigAdres.plaats }}"/>
      </div>
      <div class="col">
        <ds-description
          label="Postcode"
          value="{{ huidigAdres.postcode }}"/>
      </div>
    </div>
    <form [formGroup]="adresgegevensForm">
      <div class="adresgegevens-tijdelijk-adres" formGroupName="tijdelijkAdres">
        <h3 class="adresgegevens-sectie-titel">Tijdelijk adres</h3>
        <ds-input
          label="Straatnaam"
          formControlName="straatnaam"
          maxlength="56"
          placeholder="Straatnaam"
          [errorMessage]="{ required: 'Straatnaam is verplicht.', maxlength: 'De straatnaam mag maximaal 56 tekens bevatten' }"
          data-testid="tijdelijk_adres_straat"
        />
        <div class="adresgegevens-huisnummer-rij">
          <ds-input
            label="Huisnummer"
            formControlName="huisnummer"
            type="number"
            maxlength="10"
            placeholder="Nummer"
            [errorMessage]="{ required: 'Huisnummer is verplicht.', maxlength: 'Het huisnummer mag maximaal 10 tekens bevatten', min: 'Het huisnummer moet minimaal 1 zijn.' }"
            data-testid="tijdelijk_adres_huisnummer"
          />
          <ds-input
            label="Huisletter"
            formControlName="huisletter"
            maxlength="1"
            placeholder="A"
            [errorMessage]="{ pattern: 'Huisletter moet een letter zijn (a-z).', maxlength: 'De huisletter mag maximaal 1 teken bevatten' }"
            data-testid="tijdelijk_adres_huisletter"
          />
          <ds-input
            label="Toevoeging"
            formControlName="huisnummerToevoeging"
            maxlength="26"
            placeholder="Toevoeging"
            [errorMessage]="{ maxlength: 'Toevoeging mag maximaal 26 karakters bevatten.' }"
            data-testid="tijdelijk_adres_toevoeging"
          />
          <ds-input
            label="Aanduiding"
            formControlName="huisnummerAanduiding"
            maxlength="2"
            [errorMessage]="{ maxlength: 'Aanduiding mag maximaal 2 karakters bevatten.' }"
            data-testid="tijdelijk_adres_aanduiding"
          />
        </div>
        <div class="adresgegevens-postcode-rij">
          <ds-input
            label="Postcode"
            formControlName="postcode"
            maxlength="7"
            placeholder="Postcode"
            [errorMessage]="{ required: 'Postcode is verplicht.', invalidPostcode: 'De postcode is ongeldig (bijv. 1234 AB).' }"
            data-testid="tijdelijk_adres_postcode"
          />
          <ds-input
            label="Plaats"
            formControlName="plaats"
            maxlength="200"
            placeholder="Plaats"
            [errorMessage]="{ required: 'Plaats is verplicht.', maxlength: 'De plaats mag maximaal 200 tekens bevatten' }"
            data-testid="tijdelijk_adres_plaats"
          />
        </div>
        <div class="adresgegevens-datum-rij">
          <ds-datepicker
            label="Begindatum"
            formControlName="begindatum"
            [errorMessage]="{ required: 'Begindatum is verplicht.', invalidDate: 'De begindatum is ongeldig.' }"
            data-testid="tijdelijk_adres_begindatum"
          />
          <ds-datepicker
            label="Einddatum"
            formControlName="einddatum"
            [min]="minEinddatum"
            [errorMessage]="{ required: 'Einddatum is verplicht.', invalidDate: 'De einddatum is ongeldig.', einddatumNaBegindatum: 'De einddatum moet na de begindatum liggen.', einddatumMaxJaren: 'De einddatum mag maximaal 1 jaar in de toekomst liggen.' }"
            data-testid="tijdelijk_adres_einddatum"
          />
        </div>
      </div>
    </form>
  </div>
  <ng-container buttons>
    <button (click)="cancel()" data-testid="btn_annuleren" ds-button-tertiary>Annuleren</button>
    <button (click)="save()"
            data-testid="btn_opslaan"
            [disabled]="adresgegevensForm.invalid"
            ds-button-primary>
      Opslaan
    </button>
  </ng-container>
</app-base-dialog>
